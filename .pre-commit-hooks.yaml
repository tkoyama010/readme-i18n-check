- id: check-readme-i18n
  name: Check README i18n drift
  description: >-
    Checks structural parity (heading levels) between README.md and each
    README.<lang>.md, and optionally flags stale translations via git
    commit dates. Python stdlib only — no third-party dependencies.
  entry: python -m check_readme_i18n --no-stale-check
  language: python
  files: ^README\..*\.md$|^README\.md$
  pass_filenames: false
