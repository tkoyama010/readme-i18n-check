[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "readme-i18n-check"
version = "0.1.0"
description = "Zero-dependency README i18n drift-detection: structural parity + stale-translation check"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Tetsuo Koyama", email = "contact@tetsuo-koyama.dev" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/tkoyama010/readme-i18n-check"
Issues = "https://github.com/tkoyama010/readme-i18n-check/issues"
Repository = "https://github.com/tkoyama010/readme-i18n-check"

[tool.ruff]
line-length = 100
lint.select = ["ALL"]
lint.ignore = ["CPY001", "PLR0917"]
lint.per-file-ignores."check_readme_i18n.py" = [
  "INP001",  # implicit namespace package - standalone script
  "S607",    # partial executable path - git expected on PATH
  "T201",    # print - CLI tool output
]
lint.per-file-ignores."tests/*" = [
  "ANN",     # missing type annotations - not critical for tests
  "D",       # docstrings - test functions are self-documenting
  "INP001",  # implicit namespace package
  "PLR2004", # magic values - normal for test data
  "S101",    # assert - normal for pytest
  "SLF001",  # private member access - testing private APIs
]

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = ["tests"]
ini_options.addopts = ["-ra", "--strict-config", "--strict-markers"]
