name: readme-i18n-check

description: >-
  Zero-dependency README i18n drift-detection: structural parity +
  stale-translation check for GitHub-native localized READMEs.

inputs:
  allowlist:
    description: >-
      Path to a file listing README.<lang>.md names exempt from stale
      checks (one filename per line, # comments allowed).
    required: false
    default: ''
  no-stale-check:
    description: Skip the stale-translation (git commit date) check.
    required: false
    default: 'false'
  repo-root:
    description: Repository root (auto-detected via git if omitted).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Run README i18n check
      shell: bash
      env:
        INPUT_ALLOWLIST: ${{ inputs.allowlist }}
        INPUT_NO_STALE_CHECK: ${{ inputs.no-stale-check }}
        INPUT_REPO_ROOT: ${{ inputs.repo-root }}
      run: |
        args=()
        if [ -n "$INPUT_ALLOWLIST" ]; then
          args+=(--allowlist "$INPUT_ALLOWLIST")
        fi
        if [ "$INPUT_NO_STALE_CHECK" = "true" ]; then
          args+=(--no-stale-check)
        fi
        if [ -n "$INPUT_REPO_ROOT" ]; then
          args+=(--repo-root "$INPUT_REPO_ROOT")
        fi
        python "$GITHUB_ACTION_PATH/check_readme_i18n.py" "${args[@]}"
